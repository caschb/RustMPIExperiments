[project]
name = "solctra-viz"
version = "0.1.0"
description = "Figures of the BS-SOLCTRA field-line simulation for the CLEI 2026 talk"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyvista>=0.44",
]

[project.scripts]
viz = "viz.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viz"]
